[package]
name = "cyber-settings"
version = "0.1.0"
edition = "2024"
description = "Cross-platform CLI and keyboard-driven TUI system settings controller"
license = "MIT"

[[bin]]
name = "cybersettings"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
